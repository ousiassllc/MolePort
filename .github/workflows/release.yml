name: Release

# main への push: コミット種別から次バージョンを判定し、タグ付けしてリリースする。
# v*.*.* タグの手動 push: そのタグでリリースする (バージョンを手動指定したい場合)。
# GITHUB_TOKEN で push したタグは他のワークフローを起動しないため、タグ付けと GoReleaser は同一ジョブで実行する。
# GUI (moleport-gui) は CGO と OS ネイティブの WebView が必要で GoReleaser では生成できないため、
# release ジョブ完了後に OS 別ランナーで wails build し、同じタグの Release へ gh release upload で追加する。
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            next="$GITHUB_REF_NAME"
          else
            next="$(scripts/next-version.sh "$GITHUB_SHA")"
          fi
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next:-<none>}"

      - name: Run tests
        if: steps.version.outputs.next != ''
        run: go test -race -count=1 ./...

      - name: Create tag
        if: github.ref_type == 'branch' && steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT" "$GITHUB_SHA"
          git push origin "refs/tags/$NEXT"

      - name: Run GoReleaser
        if: steps.version.outputs.next != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.next }}

  gui-linux:
    name: GUI (linux/${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install templ and wails
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build assets
        run: |
          templ generate
          npm ci
          npm run build

      - name: Build GUI
        working-directory: cmd/moleport-gui
        run: >
          wails build -tags gui,webkit2_41 -skipbindings -s -nosyncgomod
          -ldflags "-X github.com/ousiassllc/moleport/internal/version.Version=${TAG#v}"

      - name: Archive
        run: |
          mkdir -p dist-gui
          tar -czf "dist-gui/moleport-gui_${TAG#v}_linux_${{ matrix.arch }}.tar.gz" \
            -C cmd/moleport-gui/build/bin moleport-gui

      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux-${{ matrix.arch }}
          path: dist-gui/*
          if-no-files-found: error

  gui-macos:
    name: GUI (darwin/universal)
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install templ and wails
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build assets
        run: |
          templ generate
          npm ci
          npm run build

      - name: Build GUI
        working-directory: cmd/moleport-gui
        run: >
          wails build -platform darwin/universal -tags gui -skipbindings -s -nosyncgomod
          -ldflags "-X github.com/ousiassllc/moleport/internal/version.Version=${TAG#v}"

      - name: Archive
        run: |
          mkdir -p dist-gui
          cd cmd/moleport-gui/build/bin
          app="$(find . -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$app" ] || { echo "no .app bundle was built"; exit 1; }
          [ "$app" = "./MolePort.app" ] || mv "$app" MolePort.app
          ditto -c -k --keepParent MolePort.app "$GITHUB_WORKSPACE/dist-gui/moleport-gui_${TAG#v}_darwin_universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gui-darwin-universal
          path: dist-gui/*
          if-no-files-found: error

  gui-windows:
    name: GUI (windows/amd64)
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install templ and wails
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build assets
        run: |
          templ generate
          npm ci
          npm run build

      # NSIS インストーラーを作るために makensis が必要。Wails は makensis が無いと警告だけでインストーラーを作らないため、
      # 直後のステップで makensis の存在を、収集ステップで生成物の存在を検証する。
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Check makensis
        run: makensis -VERSION

      # インストーラーの製品バージョン (DisplayVersion・ファイルバージョン) をリリースタグから渡す。
      # NSIS の VIProductVersion は数値 4 区切りのため、タグ先頭の X.Y.Z だけを使う。
      - name: Set installer version from tag
        working-directory: cmd/moleport-gui
        run: |
          node -e '
            const fs = require("fs");
            const m = /^v?(\d+\.\d+\.\d+)/.exec(process.env.TAG);
            if (!m) throw new Error("cannot derive X.Y.Z from tag: " + process.env.TAG);
            const cfg = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            cfg.info.productVersion = m[1];
            fs.writeFileSync("wails.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Build GUI and installer
        working-directory: cmd/moleport-gui
        run: >
          wails build -platform windows/amd64 -tags gui -skipbindings -s -nosyncgomod
          -nsis -installscope user
          -ldflags "-X github.com/ousiassllc/moleport/internal/version.Version=${TAG#v}"

      - name: Collect installer
        run: |
          installer=cmd/moleport-gui/build/bin/moleport-gui-amd64-installer.exe
          [ -f "$installer" ] || { echo "installer was not built: $installer"; exit 1; }
          mkdir -p dist-gui
          cp "$installer" "dist-gui/moleport-gui_${TAG#v}_windows_amd64_installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows-amd64
          path: dist-gui/*
          if-no-files-found: error

  gui-publish:
    name: Publish GUI assets
    needs: [release, gui-linux, gui-macos, gui-windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: dist-gui
          merge-multiple: true

      - name: Generate checksums_gui.txt
        working-directory: dist-gui
        run: sha256sum moleport-gui_* > checksums_gui.txt

      - name: Upload to GitHub Release
        run: gh release upload "$TAG" dist-gui/* --clobber --repo "$GITHUB_REPOSITORY"
